name: alertes

on:
  schedule:
    - cron: "1,16,31,46 * * * *"
    - cron: "2 * * * *"
    - cron: "3 0,4,8,12,16,20 * * *"
  workflow_dispatch:
    inputs:
      style:
        description: Style à lire
        required: true
        default: day
        type: choice
        options:
          - scalping
          - day
          - swing

permissions:
  contents: write

jobs:
  ntfy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: choisir le style
        run: |
          if [ -n "${{ github.event.inputs.style }}" ]; then
            echo "STYLE=${{ github.event.inputs.style }}" >> "$GITHUB_ENV"
          else
            case "${{ github.event.schedule }}" in
              "1,16,31,46 * * * *") echo "STYLE=scalping" >> "$GITHUB_ENV" ;;
              "2 * * * *") echo "STYLE=day" >> "$GITHUB_ENV" ;;
              *) echo "STYLE=swing" >> "$GITHUB_ENV" ;;
            esac
          fi
      - run: node notify.mjs
      - name: garder les alertes déjà envoyées
        run: |
          git config user.email "cathep@users.noreply.github.com"
          git config user.name "Cathep"
          git add notify-seen.json
          git diff --cached --quiet || git commit -m "Mémoire des alertes déjà envoyées"
          git push
