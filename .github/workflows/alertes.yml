name: alertes

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      style:
        description: Style à lire
        required: true
        default: day
        type: choice
        options:
          - scalping
          - day
          - swing

permissions:
  contents: write

jobs:
  ntfy:
    runs-on: ubuntu-latest
    concurrency:
      group: alertes
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: choisir le style
        run: |
          if [ -n "${{ github.event.inputs.style }}" ]; then
            echo "STYLE=${{ github.event.inputs.style }}" >> "$GITHUB_ENV"
          fi
      - run: node notify.mjs
      - name: garder les alertes déjà envoyées
        run: |
          git config user.email "cathep@users.noreply.github.com"
          git config user.name "Cathep"
          git add notify-seen.json demo-trades.json
          git diff --cached --quiet || git commit -m "Mémoire des alertes déjà envoyées"
          git push
